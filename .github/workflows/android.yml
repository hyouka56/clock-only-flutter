name: Flutter Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Gradle wrapper scripts
        shell: bash
        run: |
          flutter create --platforms=android --project-name wrapper_seed "$RUNNER_TEMP/wrapper_seed"
          cp "$RUNNER_TEMP/wrapper_seed/android/gradlew" android/gradlew
          cp "$RUNNER_TEMP/wrapper_seed/android/gradlew.bat" android/gradlew.bat
          cp "$RUNNER_TEMP/wrapper_seed/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build ARM64-only release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK contains only ARM64 native libraries
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          import zipfile

          apk_path = "build/app/outputs/flutter-apk/app-release.apk"
          with zipfile.ZipFile(apk_path) as apk:
              abis = {
                  name.split("/")[1]
                  for name in apk.namelist()
                  if name.startswith("lib/")
                  and len(name.split("/")) > 2
                  and name.endswith(".so")
              }
          print(f"Native ABIs in APK: {sorted(abis)}")
          if abis != {"arm64-v8a"}:
              print("ERROR: APK must contain only arm64-v8a native libraries", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Upload ARM64-only APK
        uses: actions/upload-artifact@v7
        with:
          name: clock-only-android-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

name: clock_only
description: A minimalist pure-black Flutter clock and alarm app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.5.4
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
